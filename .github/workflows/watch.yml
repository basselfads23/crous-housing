name: CROUS Housing Watcher

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    name: Run CROUS Watcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          python -m playwright install --with-deps chromium

      - name: Run CROUS Watcher
        env:
          CROUS_EMAIL: ${{ secrets.CROUS_EMAIL }}
          CROUS_PASSWORD: ${{ secrets.CROUS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python crous_watcher.py

      - name: Commit updated state file
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listings_seen.json
          git diff --staged --quiet || (git commit -m "chore: update listings_seen.json state [skip ci]" && git push)
