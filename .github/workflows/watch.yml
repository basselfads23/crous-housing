name: CROUS Housing Watcher

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a test listing notification to phone'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  watch:
    name: Run CROUS Watcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run CROUS Watcher
        env:
          CROUS_EMAIL: ${{ secrets.CROUS_EMAIL }}
          CROUS_PASSWORD: ${{ secrets.CROUS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python crous_watcher.py

      - name: Commit updated state and run history log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listings_seen.json run_history.log
          git diff --staged --quiet || (git commit -m "chore: update listings_seen.json and run_history.log [skip ci]" && git push)
